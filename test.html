<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Measure & Object Scanner</title>

  <!-- Mobile PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="192x192" href="https://companieslogo.com/img/orig/E-c310aaa5.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://companieslogo.com/img/orig/E-c310aaa5.png">

  <!-- Inline Web App Manifest for PWABuilder (PWA-to-APK) -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "AR Measure & Object ID",
    "short_name": "AR Scanner",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#0f172a",
    "theme_color": "#0f172a",
    "icons": [
      {
        "src": "https://companieslogo.com/img/orig/E-c310aaa5.png",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any maskable"
      },
      {
        "src": "https://companieslogo.com/img/orig/E-c310aaa5.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  }'>

  <!-- TensorFlow.js & COCO-SSD Object Detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #f43f5e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      padding-bottom: 5.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
      width: 100%;
      max-width: 540px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .panel {
      width: 100%;
      max-width: 540px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background-color: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary.active, .btn-primary:hover {
      background-color: var(--accent);
      color: var(--bg);
    }

    .btn-success {
      border-color: var(--success);
      color: var(--success);
    }

    .btn-success.active, .btn-success:hover {
      background-color: var(--success);
      color: #fff;
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #fff;
    }

    /* Object Detection Viewport */
    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 62vh;
      background: #020617;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--accent);
      display: none;
    }

    .camera-box.active {
      display: block;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas {
      pointer-events: none;
    }

    .camera-overlay-controls {
      position: absolute;
      bottom: 0.75rem;
      left: 0.75rem;
      right: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      gap: 0.5rem;
    }

    .pill-badge {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    /* AR Measurement HUD (Shown inside WebXR DOM Overlay) */
    #arOverlayContainer {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    #arOverlayContainer.xr-active {
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 1.25rem;
      pointer-events: none;
    }

    .ar-top-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      text-align: center;
      width: 100%;
      max-width: 420px;
      pointer-events: auto;
    }

    .ar-readout {
      font-size: 2rem;
      font-weight: 800;
      color: var(--success);
      letter-spacing: -0.02em;
    }

    .ar-sub-readout {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* Center Aiming Reticle */
    .reticle-ring {
      width: 44px;
      height: 44px;
      border: 3px solid var(--muted);
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, transform 0.2s;
    }

    .reticle-ring::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--muted);
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .reticle-ring.locked {
      border-color: var(--success);
      transform: scale(1.1);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.6);
    }

    .reticle-ring.locked::after {
      background-color: var(--success);
    }

    .ar-bottom-controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
      pointer-events: auto;
    }

    /* Measurement History */
    .history-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 700;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    .history-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.45rem 0.65rem;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--warning);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 0.65rem;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>AR Measure & Object ID</h1>
    <p>Point-to-Point AR Ruler & Live AI Object Detection</p>
  </header>

  <div class="panel">
    <div id="statusMsg" class="status-msg"></div>

    <!-- Mode Buttons -->
    <div class="mode-switch">
      <button id="btnIdentify" class="btn btn-primary">
        🔍 Identify Objects
      </button>
      <button id="btnMeasure" class="btn btn-success">
        📏 AR Measure
      </button>
    </div>

    <!-- Live Object Detection Camera View -->
    <div id="cameraBox" class="camera-box">
      <video id="videoEl" autoplay playsinline muted></video>
      <canvas id="canvasEl"></canvas>
      <div class="camera-overlay-controls">
        <span id="detectedCountBadge" class="pill-badge">Objects: 0</span>
        <div style="display: flex; gap: 0.4rem;">
          <button id="btnTorch" class="btn" style="padding: 0.45rem 0.75rem; font-size: 0.8rem; display: none;">
            🔦 Light
          </button>
          <button id="btnStopCamera" class="btn btn-danger" style="padding: 0.45rem 0.75rem; font-size: 0.8rem;">
            ⏹ Stop
          </button>
        </div>
      </div>
    </div>

    <!-- WebXR AR Measurement Overlay -->
    <div id="arOverlayContainer">
      <div class="ar-top-card">
        <div id="arReadout" class="ar-readout">0.0 cm</div>
        <div id="arSubReadout" class="ar-sub-readout">Move phone slowly over a flat surface...</div>
      </div>

      <div id="reticleRing" class="reticle-ring"></div>

      <div class="ar-bottom-controls">
        <button id="btnMarkPoint" class="btn btn-success" style="flex: 2; background: var(--success); color: #fff;">
          📍 Mark Start (0/2)
        </button>
        <button id="btnExitAr" class="btn btn-danger" style="flex: 1; background: rgba(15,23,42,0.9);">
          ✕ Exit
        </button>
      </div>
    </div>

    <!-- Saved Measurements List -->
    <div class="history-box">
      <div class="history-header">
        <span>Saved AR Measurements</span>
        <button id="btnClearHistory" style="background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer;">
          Clear
        </button>
      </div>
      <ul id="historyList" class="history-list">
        <li style="color: var(--muted); justify-content: center;">No measurements yet</li>
      </ul>
    </div>
  </div>

  <script>
    let cocoModel = null;
    let mediaStream = null;
    let detectFrameId = null;
    let torchOn = false;

    let xrSession = null;
    let xrPoints = [];
    let latestHitPose = null;
    let savedMeasurements = [];

    const statusMsg = document.getElementById('statusMsg');
    const btnIdentify = document.getElementById('btnIdentify');
    const btnMeasure = document.getElementById('btnMeasure');
    const cameraBox = document.getElementById('cameraBox');
    const videoEl = document.getElementById('videoEl');
    const canvasEl = document.getElementById('canvasEl');
    const detectedCountBadge = document.getElementById('detectedCountBadge');
    const btnTorch = document.getElementById('btnTorch');
    const btnStopCamera = document.getElementById('btnStopCamera');

    const arOverlayContainer = document.getElementById('arOverlayContainer');
    const arReadout = document.getElementById('arReadout');
    const arSubReadout = document.getElementById('arSubReadout');
    const reticleRing = document.getElementById('reticleRing');
    const btnMarkPoint = document.getElementById('btnMarkPoint');
    const btnExitAr = document.getElementById('btnExitAr');
    const historyList = document.getElementById('historyList');
    const btnClearHistory = document.getElementById('btnClearHistory');

    function showStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.style.display = 'block';
      statusMsg.style.color = isError ? 'var(--danger)' : 'var(--warning)';
      statusMsg.style.borderColor = isError ? 'rgba(244, 63, 94, 0.4)' : 'rgba(245, 158, 11, 0.4)';
      statusMsg.style.background = isError ? 'rgba(244, 63, 94, 0.12)' : 'rgba(245, 158, 11, 0.12)';
    }

    function hideStatus() {
      statusMsg.style.display = 'none';
    }

    function stopEverything() {
      if (detectFrameId) {
        cancelAnimationFrame(detectFrameId);
        detectFrameId = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      torchOn = false;
      btnTorch.style.display = 'none';
      cameraBox.classList.remove('active');
      btnIdentify.classList.remove('active');

      if (xrSession) {
        xrSession.end().catch(() => {});
        xrSession = null;
      }
      arOverlayContainer.classList.remove('xr-active');
      arOverlayContainer.style.display = 'none';
      btnMeasure.classList.remove('active');
    }

    btnStopCamera.addEventListener('click', () => {
      stopEverything();
      hideStatus();
    });

    btnExitAr.addEventListener('click', () => {
      stopEverything();
      hideStatus();
    });

    // ==========================================
    // 1. OBJECT IDENTIFICATION MODE
    // ==========================================
    btnIdentify.addEventListener('click', async () => {
      stopEverything();
      btnIdentify.classList.add('active');
      cameraBox.classList.add('active');

      try {
        showStatus('Starting rear camera...');
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoEl.srcObject = mediaStream;
        await videoEl.play();

        // Check flashlight support
        const track = mediaStream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) {
          btnTorch.style.display = 'inline-flex';
          btnTorch.onclick = async () => {
            torchOn = !torchOn;
            await track.applyConstraints({ advanced: [{ torch: torchOn }] });
            btnTorch.textContent = torchOn ? '💡 Light On' : '🔦 Light';
          };
        }

        if (!cocoModel) {
          showStatus('Loading AI Object Detection model (first time takes ~3s)...');
          cocoModel = await cocoSsd.load();
        }

        hideStatus();
        const ctx = canvasEl.getContext('2d');

        const runDetection = async () => {
          if (!mediaStream) return;
          if (videoEl.readyState === 4) {
            canvasEl.width = videoEl.videoWidth;
            canvasEl.height = videoEl.videoHeight;
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            const predictions = await cocoModel.detect(videoEl);
            detectedCountBadge.textContent = `Objects: ${predictions.length}`;

            predictions.forEach(pred => {
              const [x, y, w, h] = pred.bbox;
              const score = Math.round(pred.score * 100);
              const label = `${pred.class.toUpperCase()} ${score}%`;

              // Bounding Box
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 4;
              ctx.strokeRect(x, y, w, h);

              // Label Tag
              ctx.font = 'bold 16px system-ui';
              const textWidth = ctx.measureText(label).width;
              const labelY = Math.max(0, y - 28);
              ctx.fillStyle = '#38bdf8';
              ctx.fillRect(x, labelY, textWidth + 14, 28);

              ctx.fillStyle = '#0f172a';
              ctx.fillText(label, x + 7, labelY + 20);
            });
          }
          detectFrameId = requestAnimationFrame(runDetection);
        };

        runDetection();
      } catch (err) {
        stopEverything();
        showStatus('Camera error: ' + err.message, true);
      }
    });

    // ==========================================
    // 2. AR LENGTH MEASUREMENT MODE (WebXR)
    // ==========================================
    btnMeasure.addEventListener('click', async () => {
      stopEverything();

      if (!navigator.xr) {
        showStatus('WebXR AR is not available. Make sure you open this over HTTPS in Chrome on Android.', true);
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      if (!supported) {
        showStatus('Your browser or device does not support WebXR immersive-ar.', true);
        return;
      }

      try {
        hideStatus();
        btnMeasure.classList.add('active');
        xrPoints = [];
        latestHitPose = null;

        arReadout.textContent = '0.0 cm';
        arSubReadout.textContent = 'Scan a flat surface until the center ring turns green.';
        btnMarkPoint.textContent = '📍 Mark Start (0/2)';
        reticleRing.classList.remove('locked');

        arOverlayContainer.style.display = 'flex';
        arOverlayContainer.classList.add('xr-active');

        const glCanvas = document.createElement('canvas');
        const gl = glCanvas.getContext('webgl', { xrCompatible: true });

        xrSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: arOverlayContainer }
        });

        xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });
        const refSpace = await xrSession.requestReferenceSpace('local');
        const viewerSpace = await xrSession.requestReferenceSpace('viewer');
        const hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

        btnMarkPoint.onclick = () => {
          if (!latestHitPose) {
            arSubReadout.textContent = 'Surface not locked yet — aim at a textured floor, table, or wall.';
            return;
          }

          const pos = latestHitPose.transform.position;
          if (xrPoints.length >= 2) {
            xrPoints = [];
          }

          xrPoints.push({ x: pos.x, y: pos.y, z: pos.z });

          if (xrPoints.length === 1) {
            arReadout.textContent = 'Start Marked';
            arSubReadout.textContent = 'Move the green ring to the end point and tap Mark End.';
            btnMarkPoint.textContent = '📍 Mark End (1/2)';
          } else if (xrPoints.length === 2) {
            const dx = xrPoints[1].x - xrPoints[0].x;
            const dy = xrPoints[1].y - xrPoints[0].y;
            const dz = xrPoints[1].z - xrPoints[0].z;
            const meters = Math.sqrt(dx * dx + dy * dy + dz * dz);

            const cm = (meters * 100).toFixed(1);
            const inches = (meters * 39.3701).toFixed(1);
            const mStr = meters.toFixed(2);

            const formatted = `${cm} cm (${inches} in)`;
            arReadout.textContent = formatted;
            arSubReadout.textContent = `${mStr} meters — Tap below to measure again.`;
            btnMarkPoint.textContent = '🔄 Measure Again';

            addMeasurementToHistory(formatted, `${mStr} m`);
          }
        };

        const onXRFrame = (time, frame) => {
          if (!xrSession) return;
          xrSession.requestAnimationFrame(onXRFrame);

          const hitResults = frame.getHitTestResults(hitTestSource);
          if (hitResults.length > 0) {
            latestHitPose = hitResults[0].getPose(refSpace);
            reticleRing.classList.add('locked');
            if (xrPoints.length === 0) {
              arSubReadout.textContent = 'Surface locked! Aim green ring at start point & tap Mark Start.';
            }
          } else {
            latestHitPose = null;
            reticleRing.classList.remove('locked');
          }
        };

        xrSession.requestAnimationFrame(onXRFrame);
        xrSession.addEventListener('end', () => {
          stopEverything();
        });
      } catch (err) {
        stopEverything();
        showStatus('Failed to launch AR: ' + err.message, true);
      }
    });

    function addMeasurementToHistory(primaryText, meterText) {
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      savedMeasurements.unshift({ primaryText, meterText, timeStr });
      renderHistory();
    }

    function renderHistory() {
      if (savedMeasurements.length === 0) {
        historyList.innerHTML = '<li style="color: var(--muted); justify-content: center;">No measurements yet</li>';
        return;
      }
      historyList.innerHTML = savedMeasurements
        .map((m, idx) => `<li><span><b>#${savedMeasurements.length - idx}</b> &nbsp; ${m.primaryText}</span><span style="color: var(--muted);">${m.timeStr}</span></li>`)
        .join('');
    }

    btnClearHistory.addEventListener('click', () => {
      savedMeasurements = [];
      renderHistory();
    });
  </script>
</body>
</html>
