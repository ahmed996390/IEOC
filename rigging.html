<!DOCTYPE html>
<html lang="en">
<head>

<!-- App Icons for iOS & Android Home Screen -->
<link rel="apple-touch-icon" sizes="180x180" href="https://companieslogo.com/img/orig/E-c310aaa5.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://companieslogo.com/img/orig/E-c310aaa5.png">

<!-- Mobile App Capabilities -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rigging Inventory">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigging Inventory</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-expired-bg: rgba(239, 68, 68, 0.15);
      --card-warning-bg: rgba(234, 179, 8, 0.15);
      --card-marked-bg: rgba(34, 197, 94, 0.15);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      
      --mark-color: #22c55e;
      --whatsapp-color: #25d366;
      --copy-color: #a855f7;
      --alert-expired: #ef4444;
      --alert-warning: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 1rem;
    }

    @media (min-width: 640px) {
      body {
        padding: 2rem;
      }
    }

    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem auto;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    /* Controls Bar */
    .file-upload-wrapper {
      max-width: 850px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    .custom-file-upload, .log-btn, .whatsapp-btn, .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      background-color: var(--card-bg);
      color: var(--accent);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      flex: 1 1 150px;
      text-align: center;
    }

    .log-btn {
      border-style: solid;
    }

    .whatsapp-btn {
      border-style: solid;
      border-color: var(--whatsapp-color);
      color: var(--whatsapp-color);
    }

    .copy-btn {
      border-style: solid;
      border-color: var(--copy-color);
      color: var(--copy-color);
    }

    .custom-file-upload:hover, .log-btn:hover {
      background-color: var(--accent);
      color: var(--bg-color);
    }

    .whatsapp-btn:hover {
      background-color: var(--whatsapp-color);
      color: #ffffff;
    }

    .copy-btn:hover {
      background-color: var(--copy-color);
      color: #ffffff;
    }

    #csvFileInput {
      display: none;
    }

    .status-banner {
      max-width: 650px;
      margin: -0.75rem auto 1.25rem auto;
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent);
      display: none;
    }

    .search-container {
      position: sticky;
      top: 0.75rem;
      z-index: 10;
      max-width: 650px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background-color: rgba(30, 41, 59, 0.95);
      padding: 0.35rem 0.5rem;
      border-radius: 9999px;
      border: 2px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--text-main);
      outline: none;
    }

    .search-mode {
      background-color: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.5rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .grid-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card.expired {
      background-color: var(--card-expired-bg);
      border-color: var(--alert-expired);
    }

    .card.expiring-soon {
      background-color: var(--card-warning-bg);
      border-color: var(--alert-warning);
    }

    .card.marked {
      background-color: var(--card-marked-bg) !important;
      border-color: var(--mark-color) !important;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .card-id {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--accent);
    }

    .card-star-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      min-width: 40px;
      height: 40px;
      padding: 0 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-star-btn:hover {
      background-color: rgba(34, 197, 94, 0.3);
      color: var(--mark-color);
      border-color: var(--mark-color);
    }

    .card.marked .card-star-btn {
      color: #0f172a;
      background-color: var(--mark-color);
      border-color: var(--mark-color);
    }

    .card-desc {
      color: var(--text-main);
      font-size: 0.9rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 16px;
      max-width: 550px;
      width: 90%;
      position: relative;
      transform: scale(0.95);
      transition: transform 0.2s;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-id {
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .modal-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 1rem;
      margin-bottom: 0.35rem;
    }

    .modal-desc, .modal-cert {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
      font-family: monospace;
      background-color: rgba(15, 23, 42, 0.6);
      padding: 0.85rem;
      border-radius: 8px;
    }

    .modal-cert {
      border-left: 3px solid var(--accent);
    }

    .modal-cert a {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    .mark-btn {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background-color: #334155;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .mark-btn.is-marked {
      background-color: var(--mark-color);
      color: #0f172a;
    }

    /* WhatsApp Share Choice Modal */
    .wa-choice-btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1rem;
      margin-top: 0.75rem;
      border-radius: 10px;
      border: none;
      background-color: var(--whatsapp-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s;
    }
    .wa-choice-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rigging Inventory</h1>
    <p style="color: var(--text-muted)">Search by Serial No, description or certificate</p>
  </header>

  <!-- Control Buttons -->
  <div class="file-upload-wrapper">
    <label for="csvFileInput" class="custom-file-upload">
      📁 Load CSV
    </label>
    <input type="file" id="csvFileInput" accept=".csv">

    <button id="downloadLogBtn" class="log-btn">
      📥 Download Excel Log
    </button>

    <button id="whatsappShareBtn" class="whatsapp-btn">
      💬 Share via WhatsApp
    </button>

    <button id="copyTextBtn" class="copy-btn">
      📋 Copy Text Table
    </button>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search Serial No, description or cert...">
    <select id="searchMode" class="search-mode">
      <option value="auto">⚡ Smart Auto</option>
      <option value="id"># Serial No Only</option>
      <option value="desc">📝 Description/Cert</option>
    </select>
  </div>

  <main class="grid-container" id="grid"></main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <div class="modal-id" id="modalId"></div>
      
      <div class="modal-section-title">Description</div>
      <div class="modal-desc" id="modalDesc"></div>

      <div id="modalCertSection" style="display: none;">
        <div class="modal-section-title">Certificate</div>
        <div class="modal-cert" id="modalCert"></div>
      </div>

      <button id="markBtn" class="mark-btn">⭐ Mark Item for Log</button>
    </div>
  </div>

  <!-- WhatsApp Choice Modal -->
  <div class="modal-overlay" id="whatsappModal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <button class="close-btn" id="closeWhatsappModal">&times;</button>
      <div class="modal-id" style="margin-bottom: 0.25rem;">Share via WhatsApp</div>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">Choose how you want to share your marked log:</p>
      
      <button id="waShareTextBtn" class="wa-choice-btn">
        💬 1st Option: Share Clean Text
      </button>

      <button id="waShareFileBtn" class="wa-choice-btn" style="background-color: #0284c7;">
        📎 2nd Option: Share CSV/Excel File
      </button>
    </div>
  </div>

  <script>
    let items = [];
    let markedItems = [];
    let activeModalItem = null;

    const fileInput = document.getElementById('csvFileInput');
    const searchInput = document.getElementById('searchInput');
    const searchMode = document.getElementById('searchMode');
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalId = document.getElementById('modalId');
    const modalDesc = document.getElementById('modalDesc');
    const modalCert = document.getElementById('modalCert');
    const modalCertSection = document.getElementById('modalCertSection');
    const closeModal = document.getElementById('closeModal');
    const markBtn = document.getElementById('markBtn');
    const downloadLogBtn = document.getElementById('downloadLogBtn');
    const whatsappShareBtn = document.getElementById('whatsappShareBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');
    const statusBanner = document.getElementById('statusBanner');

    const whatsappModal = document.getElementById('whatsappModal');
    const closeWhatsappModal = document.getElementById('closeWhatsappModal');
    const waShareTextBtn = document.getElementById('waShareTextBtn');
    const waShareFileBtn = document.getElementById('waShareFileBtn');

    window.addEventListener('DOMContentLoaded', () => {
      const savedCSV = localStorage.getItem('rigging_saved_csv');
      const savedFileName = localStorage.getItem('rigging_csv_filename');

      if (savedCSV) {
        parseCSV(savedCSV);
        filterData();
        showStatusBanner(`Loaded database: <strong>${savedFileName || 'inventory.csv'}</strong> (${items.length} items)`);
      }
    });

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const csvContent = evt.target.result;
        try {
          localStorage.setItem('rigging_saved_csv', csvContent);
          localStorage.setItem('rigging_csv_filename', file.name);
        } catch(e) {}

        parseCSV(csvContent);
        markedItems = [];
        filterData();
        showStatusBanner(`Successfully loaded: <strong>${file.name}</strong> (${items.length} items)`);
      };
      reader.readAsText(file);
    });

    function showStatusBanner(msg) {
      statusBanner.innerHTML = msg;
      statusBanner.style.display = 'block';
    }

    function extractField(text, fieldName) {
      if (!text) return "";
      const regex = new RegExp(fieldName + "[:\\s]*([^\\n\\r]+)", "i");
      const match = text.match(regex);
      return match && match[1] ? match[1].trim() : "";
    }

    function parseNextExamDate(descText) {
      const dateStr = extractField(descText, "NEXT\\s+EXAMINATION\\s+DATE");
      if (dateStr) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
        }
      }
      return null;
    }

    function parseCSV(text) {
      items = [];
      const lines = [];
      let row = [];
      let cell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell.trim());
          if (row.length > 0 && row.some(c => c !== '')) lines.push(row);
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      if (cell || row.length > 0) {
        row.push(cell.trim());
        lines.push(row);
      }

      const startIdx = lines.length > 0 && isNaN(lines[0][0]) ? 1 : 0;

      for (let i = startIdx; i < lines.length; i++) {
        const r = lines[i];
        if (r.length >= 2) {
          const id = r[0]; 
          let desc = r[1]; 
          let certName = r[2] || ''; 
          let certUrl = r[3] || '';

          if (desc && desc.includes('%')) {
            try { desc = decodeURIComponent(desc); } catch(e) {}
          }
          if (certName && certName.includes('%')) {
            try { certName = decodeURIComponent(certName); } catch(e) {}
          }
          if (certUrl && certUrl.includes('%')) {
            try { certUrl = decodeURIComponent(certUrl); } catch(e) {}
          }

          const examDate = parseNextExamDate(desc);
          const swlVal = extractField(desc, "SWL");

          items.push({ 
            id: id, 
            description: desc, 
            certName: certName, 
            certUrl: certUrl,
            examDate: examDate,
            swl: swlVal
          });
        }
      }
    }

    function renderGrid(data) {
      grid.innerHTML = '';
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const thirtyDaysFromNow = new Date(today);
      thirtyDaysFromNow.setDate(today.getDate() + 30);

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        if (item.examDate) {
          if (item.examDate < today) {
            card.classList.add('expired');
          } else if (item.examDate <= thirtyDaysFromNow) {
            card.classList.add('expiring-soon');
          }
        }

        const markIndex = markedItems.indexOf(item.id);
        const isMarked = markIndex > -1;
        if (isMarked) {
          card.classList.add('marked');
        }
        
        card.innerHTML = `
          <div class="card-header-row">
            <div class="card-id">Serial: #${item.id}</div>
            <button class="card-star-btn" title="Toggle Mark" data-id="${item.id}">
              ${isMarked ? (markIndex + 1) : '☆'}
            </button>
          </div>
          <div class="card-desc">${item.description}</div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-star-btn')) return;
          openModal(item);
        });

        const starBtn = card.querySelector('.card-star-btn');
        starBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMark(item.id);
        });

        grid.appendChild(card);
      });
    }

    function toggleMark(id) {
      const index = markedItems.indexOf(id);
      if (index > -1) {
        markedItems.splice(index, 1);
      } else {
        markedItems.push(id);
      }
      updateMarkButtonState();
      filterData();
    }

    function openModal(item) {
      activeModalItem = item;
      modalId.textContent = `Serial: #${item.id}`;
      modalDesc.textContent = item.description;
      
      if (item.certName && item.certName.trim() !== '') {
        let name = item.certName;
        let url = item.certUrl;

        if (!url && (name.startsWith('http://') || name.startsWith('https://') || name.startsWith('www.'))) {
          url = name.startsWith('www.') ? 'https://' + name : name;
        }

        if (url) {
          let cleanUrl = url.startsWith('www.') ? 'https://' + url : url;
          modalCert.innerHTML = `<a href="${cleanUrl}" target="_blank">🔗 ${name}</a>`;
        } else {
          modalCert.textContent = name;
        }
        modalCertSection.style.display = 'block';
      } else {
        modalCertSection.style.display = 'none';
      }

      updateMarkButtonState();
      modal.classList.add('active');
    }

    function updateMarkButtonState() {
      if (!activeModalItem) return;
      const index = markedItems.indexOf(activeModalItem.id);
      if (index > -1) {
        markBtn.textContent = `✓ Marked (#${index + 1}) (Click to Unmark)`;
        markBtn.classList.add('is-marked');
      } else {
        markBtn.textContent = "⭐ Mark Item for Log";
        markBtn.classList.remove('is-marked');
      }
    }

    markBtn.addEventListener('click', () => {
      if (!activeModalItem) return;
      toggleMark(activeModalItem.id);
    });

    closeModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    function filterData() {
      let term = searchInput.value.toLowerCase().trim();
      const mode = searchMode.value;

      term = term.replace(/^#|^id/i, '');

      if (!term) {
        renderGrid(items);
        return;
      }

      let filtered = [];

      if (mode === 'id') {
        filtered = items.filter(item => String(item.id).toLowerCase() === term);
      } else if (mode === 'desc') {
        filtered = items.filter(item => item.description.toLowerCase().includes(term) || (item.certName && item.certName.toLowerCase().includes(term)));
      } else {
        const exactIdMatches = items.filter(item => String(item.id).toLowerCase() === term);
        if (exactIdMatches.length > 0) {
          filtered = exactIdMatches;
        } else {
          filtered = items.filter(item => item.description.toLowerCase().includes(term) || (item.certName && item.certName.toLowerCase().includes(term)));
        }
      }

      renderGrid(filtered);
    }

    searchInput.addEventListener('input', filterData);
    searchMode.addEventListener('change', filterData);

    function generateCSVContent() {
      let csvRows = [];
      csvRows.push(['ID', 'Serial', 'SWL', 'NEXT EXAMINATION DATE'].map(field => `"${field}"`).join(','));

      markedItems.forEach((id, index) => {
        const itemObj = items.find(i => i.id === id);
        if (itemObj) {
          const swlClean = (itemObj.swl || '').replace(/"/g, '""');
          const examDateStr = extractField(itemObj.description, "NEXT\\s+EXAMINATION\\s+DATE");

          const rowData = [
            index + 1,
            itemObj.id,
            swlClean,
            examDateStr
          ];

          csvRows.push(rowData.map(val => `"${val}"`).join(','));
        }
      });

      return csvRows.join('\r\n');
    }

    function generateFormattedTextTable() {
      let textLines = ["*Rigging Inventory Marked Log* 📋\n"];
      markedItems.forEach((id, index) => {
        const itemObj = items.find(i => i.id === id);
        if (itemObj) {
          const swlClean = itemObj.swl || 'N/A';
          const examDateStr = extractField(itemObj.description, "NEXT\\s+EXAMINATION\\s+DATE") || 'N/A';
          
          textLines.push(`${index + 1}- Serial: *${itemObj.id}* | SWL: ${swlClean} | Next Exam: ${examDateStr}`);
        }
      });
      return textLines.join("\n");
    }

    // Download Excel Log Button
    downloadLogBtn.addEventListener('click', () => {
      if (markedItems.length === 0) {
        alert("No items have been marked yet! Click the star on a card or open a card to mark items.");
        return;
      }

      const csvContent = generateCSVContent();
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      
      const dateStr = new Date().toISOString().slice(0,10);
      link.href = URL.createObjectURL(blob);
      link.download = `Marked_Rigging_Log_${dateStr}.csv`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // Open WhatsApp Choice Modal
    whatsappShareBtn.addEventListener('click', () => {
      if (markedItems.length === 0) {
        alert("No items have been marked yet! Click the star on a card or open a card to mark items.");
        return;
      }
      whatsappModal.classList.add('active');
    });

    closeWhatsappModal.addEventListener('click', () => whatsappModal.classList.remove('active'));
    whatsappModal.addEventListener('click', (e) => {
      if (e.target === whatsappModal) whatsappModal.classList.remove('active');
    });

    // Option 1: Share Clean Text via WhatsApp
    waShareTextBtn.addEventListener('click', () => {
      whatsappModal.classList.remove('active');
      const finalMessage = generateFormattedTextTable();
      const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(finalMessage)}`;
      window.open(whatsappUrl, '_blank');
    });

    // Option 2: Share CSV/Excel File via WhatsApp (using native share sheet)
    waShareFileBtn.addEventListener('click', async () => {
      whatsappModal.classList.remove('active');
      const dateStr = new Date().toISOString().slice(0,10);
      const fileName = `Marked_Rigging_Log_${dateStr}.csv`;
      const csvContent = generateCSVContent();
      const file = new File([csvContent], fileName, { type: 'text/csv' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: 'Rigging Inventory Log',
            text: 'Here is the marked rigging inventory log file:',
            files: [file]
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback if file sharing is not supported by the browser
      alert("Direct file sharing is not supported on this browser/device. We have downloaded the CSV file for you instead—you can now attach it manually in WhatsApp!");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // Copy Text Table Button
    copyTextBtn.addEventListener('click', () => {
      if (markedItems.length === 0) {
        alert("No items have been marked yet! Click the star on a card or open a card to mark items.");
        return;
      }

      const textTable = generateFormattedTextTable().replace(/\*/g, '');
      navigator.clipboard.writeText(textTable).then(() => {
        alert("Cleanly formatted table text copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy text.");
      });
    });
  </script>
</body>
</html>
