  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
  background-color: var(--bg-color);
  /* Uses your Eni logo URL overlaid with a soft dark tint */
  background-image: 
    linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.88)), 
    url('https://companieslogo.com/img/orig/E-c310aaa5.png');
  background-repeat: no-repeat;
  background-position: center center;
  background-attachment: fixed;
  background-size: 850px auto; /* Adjust the width of the logo watermark */
  color: var(--text-main);
  min-height: 100vh;
  padding: 2rem;
}

    header {
      max-width: 1200px;
      margin: 0 auto 2rem auto;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .search-container {
      position: sticky;
      top: 1rem;
      z-index: 10;
      max-width: 600px;
      margin: 0 auto 2rem auto;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      border-radius: 9999px;
      border: 2px solid var(--border);
      background-color: rgba(30, 41, 59, 0.9);
      color: var(--text-main);
      backdrop-filter: blur(8px);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .grid-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-id {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 16px;
      max-width: 550px;
      width: 90%;
      position: relative;
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .modal-id {
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .modal-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
      font-family: monospace;
      background-color: rgba(15, 23, 42, 0.6);
      padding: 1rem;
      border-radius: 8px;
    }
  </style>
</head>

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('modal');
    const modalId = document.getElementById('modalId');
    const modalDesc = document.getElementById('modalDesc');
    const closeModal = document.getElementById('closeModal');

    function renderItems(filteredItems) {
      grid.innerHTML = '';
      if (filteredItems.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No items found.</p>';
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-id">Material ID #${item.id}</div>
          <div class="card-desc">${item.description}</div>
        `;
        card.addEventListener('click', () => openModal(item.id));
        grid.appendChild(card);
      });
    }

    // Strict ID match for numbers; keyword search for text
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();

      if (!query) {
        renderItems(items);
        return;
      }

      const filtered = items.filter(item => {
        const isNumeric = !isNaN(query);

        if (isNumeric) {
          return item.id === parseInt(query, 10);
        }

        return item.description.toLowerCase().includes(query);
      });

      renderItems(filtered);
    });

    function openModal(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      modalId.textContent = `Item #${item.id}`;
      modalDesc.textContent = item.description;
      modal.classList.add('active');

      history.pushState(null, null, `#${item.id}`);
    }

    function hideModal() {
      modal.classList.remove('active');
      history.pushState(null, null, ' ');
    }

    closeModal.addEventListener('click', hideModal);
    
    modal.addEventListener('click', (e) => {
      if (e.target === modal) hideModal();
    });

    function handleHashChange() {
      const hash = window.location.hash.substring(1);
      const itemId = parseInt(hash, 10);
      if (!isNaN(itemId)) {
        openModal(itemId);
      } else {
        modal.classList.remove('active');
      }
    }

    window.addEventListener('load', handleHashChange);
    window.addEventListener('popstate', handleHashChange);

    renderItems(items);
  </script>
